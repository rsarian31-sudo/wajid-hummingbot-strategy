name: historical-backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "UTC start date, YYYY-MM-DD"
        required: true
        default: "2026-01-01"
      end:
        description: "UTC end date, YYYY-MM-DD"
        required: true
        default: "2026-02-01"
      symbol:
        description: "Binance USD-M symbol"
        required: true
        default: "BTCUSDT"
  push:
    paths:
      - "download_binance_5m.py"
      - "backtest.py"
      - "wajid_liquidity_signal.py"
      - "requirements.txt"
      - ".github/workflows/historical-backtest.yml"

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p data
      - name: Download historical data
        env:
          START: ${{ inputs.start || '2026-01-01' }}
          END: ${{ inputs.end || '2026-02-01' }}
          SYMBOL: ${{ inputs.symbol || 'BTCUSDT' }}
        run: python download_binance_5m.py --symbol "$SYMBOL" --start "$START" --end "$END" --out data/market.csv
      - run: python backtest.py data/market.csv --out backtest_trades.csv
      - uses: actions/upload-artifact@v4
        with:
          name: wajid-backtest-results
          path: |
            backtest_trades.csv
            data/market.csv
